<rect x="40" y="378" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="60" y="388" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Skriv svar</text>
