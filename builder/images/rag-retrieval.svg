<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Agentisk retrieval i AarhusAI</title><desc>Spørgsmålet omskrives, der søges i Qdrant, og agenten vurderer om resultaterne er relevante. Hvis ikke, søges der igen. Hvis ja, udvælges de bedste stykker, og sprogmodellen svarer med kilder.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="430" fill="#FFFFFF"/>
<rect x="220" y="24" width="420" height="292" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="240" y="262" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start">retrieval-agent</text>
<text x="240" y="282" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Agentisk tilstand</text>
<rect x="40" y="60" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="115.0" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Spørgsmål</text><text x="115.0" y="102" text-anchor="middle" font-size="12" fill="#5F5E5A">Fra Open WebUI</text>
<path d="M192 88 L238 88" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="240" y="60" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="325.0" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Omskriv spørgsmål</text><text x="325.0" y="102" text-anchor="middle" font-size="12" fill="#0F6E56">LLM laver 1-2 søgninger</text>
<path d="M412 88 L448 88" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="450" y="60" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="535.0" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Søg i Qdrant</text><text x="535.0" y="102" text-anchor="middle" font-size="12" fill="#0F6E56">Betydning + ord</text>
<path d="M535 118 L535 148" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="450" y="150" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="535.0" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">Relevant?</text><text x="535.0" y="192" text-anchor="middle" font-size="12" fill="#854F0B">Agenten vurderer</text>
<path d="M448 178 L325 178 L325 120" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="387" y="198" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">Nej: prøv igen</text>
<path d="M535 208 L535 238" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<text x="545" y="226" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Ja</text>
<rect x="450" y="240" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="535.0" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Udvælg top-k</text><text x="535.0" y="282" text-anchor="middle" font-size="12" fill="#0F6E56">Kun egne vidensbaser</text>
<path d="M535 298 L535 344" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="450" y="346" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="535.0" y="369" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Sprogmodel</text><text x="535.0" y="388" text-anchor="middle" font-size="12" fill="#993C1D">Spørgsmål + kontekst</text>
<path d="M448 374 L412 374" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="240" y="346" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="325.0" y="369" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Svar</text><text x="325.0" y="388" text-anchor="middle" font-size="12" fill="#5F5E5A">Med kildehenvisning</text>
